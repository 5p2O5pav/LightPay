server:
  listen: ":8080"
  domain: "pay.example.com"

database: "data/lightpay.db"

api_token: "your-secret-signature-token"

tron:
  api_key: "your-trongrid-api-key"
  network: "mainnet"
  wallets:
    - "TRX_WALLET_1"
    - "TRX_WALLET_2"

polygon:
  rpc_url: "https://polygon-mainnet.g.alchemy.com/v2/YOUR_KEY"
  usdt_contract: "0x3c499c542cEF5E3811e1192ce70d8cC03d5c3359"
  wallets:
    - "POLY_WALLET_1"

bsc:
  rpc_url: "https://bsc-dataseed.binance.org/"
  usdt_contract: "0x55d398326f99059fF775485246999027B3197955"
  wallets:
    - "BSC_WALLET_1"

telegram:
  enabled: false
  bot_token: ""
  chat_id: 0

pricing:
  default_currency: "CNY"
  markup_percent: 1.5
  mode: "realtime"           # manual or realtime
  manual_rates:
    CNY_USDT: 7.25
    CNY_TRX: 0.88
  realtime:
    provider: "coingecko"
    cache_seconds: 60
