<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>交易繁忙 - LightPay</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #f5f7fa;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            padding: 40px;
            text-align: center;
            max-width: 500px;
        }
        h1 { color: #e67e22; margin-bottom: 16px; }
        p { color: #4a5568; line-height: 1.6; margin-bottom: 24px; }
        .btn {
            background: #3498db;
            color: white;
            border: none;
            padding: 10px 24px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
        }
        .btn:hover { background: #2980b9; }
    </style>
</head>
<body>
<div class="card">
    <h1>⏳ 交易繁忙</h1>
    <p>当前支付请求过于集中，请稍后再试，或选择其他支付方式。</p>
    <a href="javascript:history.back()" class="btn">返回重试</a>
</div>
</body>
</html>
